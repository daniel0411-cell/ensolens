<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730"><rect width="1000" height="730" fill="#10201d"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="24" y="42" font-size="32" fill="#e2e8f0">Three clocks, no single end date</text><text x="24" y="75" font-size="24" fill="#e2e8f0">Conceptual; not a forecast</text><rect x="24" y="90" width="952" height="186" rx="8" fill="#183b35"/><text x="42" y="124" font-size="26" fill="#e2e8f0">Ocean peak</text><path d="M50 225Q400 85 580 168T950 222" fill="none" stroke="#f7a962" stroke-width="5"/><text x="48" y="259" font-size="24" fill="#e2e8f0">Peak judged retrospectively</text><rect x="24" y="300" width="952" height="186" rx="8" fill="#183b35"/><text x="42" y="334" font-size="26" fill="#e2e8f0">Official phase</text><text x="44" y="380" font-size="25" fill="#e2e8f0">Ocean evidence + atmospheric response → CPC assessment</text><text x="44" y="464" font-size="24" fill="#e2e8f0">Not one weekly crossing</text><rect x="24" y="510" width="952" height="186" rx="8" fill="#183b35"/><text x="42" y="544" font-size="26" fill="#e2e8f0">Regional impacts</text><text x="44" y="590" font-size="25" fill="#e2e8f0">Local weather and water stores need their own evidence</text><text x="44" y="674" font-size="24" fill="#e2e8f0">No fixed delay or order</text></g></svg>