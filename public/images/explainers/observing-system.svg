<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#10201d"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="24" y="42" font-size="32" fill="#e2e8f0">From instruments to assessment</text><rect x="24" y="90" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="125" font-size="26" fill="#e2e8f0">Ocean instruments</text><text x="42" y="172" font-size="23" fill="#e2e8f0">Buoys, ships, satellites</text><path d="M500 251L500 271" fill="none" stroke="#34d399" stroke-width="3" /><text x="492" y="273" font-size="25" fill="#34d399">↓</text><rect x="24" y="278" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="313" font-size="26" fill="#e2e8f0">Processed SST analysis</text><text x="42" y="360" font-size="23" fill="#e2e8f0">Quality checks; product-specific</text><path d="M500 439L500 459" fill="none" stroke="#34d399" stroke-width="3" /><text x="492" y="461" font-size="25" fill="#34d399">↓</text><rect x="24" y="466" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="501" font-size="26" fill="#e2e8f0">Regional / seasonal method</text><text x="42" y="548" font-size="23" fill="#e2e8f0">Named box; then index method</text><path d="M500 627L500 647" fill="none" stroke="#34d399" stroke-width="3" /><text x="492" y="649" font-size="25" fill="#34d399">↓</text><rect x="24" y="654" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="689" font-size="26" fill="#e2e8f0">ENSO assessment</text><text x="42" y="736" font-size="23" fill="#e2e8f0">Ocean + atmosphere together</text><rect x="24" y="868" width="952" height="96" rx="8" fill="#294455"/><text x="42" y="902" font-size="23" fill="#e2e8f0">Separate winds, pressure and rainfall observations → assessment</text></g></svg>