<svg xmlns="http://www.w3.org/2000/svg" width="480" height="670"><rect width="480" height="670" fill="#10201d"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="24" y="38" font-size="27" fill="#e2e8f0">Overlapping seasonal windows</text><text x="24" y="76" font-size="24" fill="#e2e8f0">Each row covers three months</text><text x="90" y="132" font-size="23" fill="#e2e8f0">Dec</text><text x="142" y="132" font-size="23" fill="#e2e8f0">Jan</text><text x="194" y="132" font-size="23" fill="#e2e8f0">Feb</text><text x="246" y="132" font-size="23" fill="#e2e8f0">Mar</text><text x="298" y="132" font-size="23" fill="#e2e8f0">Apr</text><text x="350" y="132" font-size="23" fill="#e2e8f0">May</text><text x="402" y="132" font-size="23" fill="#e2e8f0">Jun</text><text x="20" y="200" font-size="24" fill="#e2e8f0">DJF</text><rect x="82" y="170" width="149" height="42" rx="8" fill="#1e6257"/><text x="111" y="199" font-size="24" fill="#e2e8f0">DJF</text><text x="20" y="270" font-size="24" fill="#e2e8f0">JFM</text><rect x="134" y="240" width="149" height="42" rx="8" fill="#1e6257"/><text x="163" y="269" font-size="24" fill="#e2e8f0">JFM</text><text x="20" y="340" font-size="24" fill="#e2e8f0">FMA</text><rect x="186" y="310" width="149" height="42" rx="8" fill="#1e6257"/><text x="215" y="339" font-size="24" fill="#e2e8f0">FMA</text><text x="20" y="410" font-size="24" fill="#e2e8f0">MAM</text><rect x="238" y="380" width="149" height="42" rx="8" fill="#1e6257"/><text x="267" y="409" font-size="24" fill="#e2e8f0">MAM</text><text x="20" y="480" font-size="24" fill="#e2e8f0">AMJ</text><rect x="290" y="450" width="149" height="42" rx="8" fill="#1e6257"/><text x="319" y="479" font-size="24" fill="#e2e8f0">AMJ</text><text x="24" y="585" font-size="24" fill="#e2e8f0">Calendar overlap only; not an</text><text x="24" y="617" font-size="24" fill="#e2e8f0">ENSO event classification</text></g></svg>