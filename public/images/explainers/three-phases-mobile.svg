<svg xmlns="http://www.w3.org/2000/svg" width="480" height="970" viewBox="0 0 480 970"><rect width="480" height="970" fill="#10201d"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="24" y="42" font-size="27" fill="#e2e8f0">Three phases of a coupled system</text><rect x="24" y="90" width="432" height="260" rx="8" fill="#183b35"/><text x="44" y="125" font-size="27" fill="#e2e8f0">El Niño</text><rect x="44" y="152" width="392" height="35" rx="8" fill="#9d542c"/><text x="44" y="221" font-size="21" fill="#e2e8f0">Warmer central / eastern Pacific</text><text x="44" y="290" font-size="23" fill="#e2e8f0">With a coupled atmospheric</text><text x="44" y="322" font-size="23" fill="#e2e8f0">response</text><rect x="24" y="370" width="432" height="260" rx="8" fill="#183b35"/><text x="44" y="405" font-size="27" fill="#e2e8f0">Neutral</text><rect x="44" y="432" width="392" height="35" rx="8" fill="#40534f"/><text x="44" y="501" font-size="21" fill="#e2e8f0">Neither event; often near-average</text><text x="44" y="533" font-size="21" fill="#e2e8f0">SST</text><text x="44" y="570" font-size="23" fill="#e2e8f0">Ocean and atmosphere may be out</text><text x="44" y="602" font-size="23" fill="#e2e8f0">of step</text><rect x="24" y="650" width="432" height="260" rx="8" fill="#183b35"/><text x="44" y="685" font-size="27" fill="#e2e8f0">La Niña</text><rect x="44" y="712" width="392" height="35" rx="8" fill="#285f75"/><text x="44" y="781" font-size="21" fill="#e2e8f0">Cooler central / eastern Pacific</text><text x="44" y="850" font-size="23" fill="#e2e8f0">With a coupled atmospheric</text><text x="44" y="882" font-size="23" fill="#e2e8f0">response</text><text x="24" y="952" font-size="24" fill="#e2e8f0">Conceptual; not current conditions</text></g></svg>