<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750"><rect width="1000" height="750" fill="#10201d"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="24" y="42" font-size="32" fill="#e2e8f0">Three phases of a coupled system</text><rect x="24" y="90" width="952" height="186" rx="8" fill="#183b35"/><text x="44" y="125" font-size="27" fill="#e2e8f0">El Niño</text><rect x="44" y="152" width="912" height="35" rx="8" fill="#9d542c"/><text x="44" y="221" font-size="26" fill="#e2e8f0">Warmer central / eastern Pacific</text><text x="44" y="255" font-size="23" fill="#e2e8f0">With a coupled atmospheric response</text><rect x="24" y="300" width="952" height="186" rx="8" fill="#183b35"/><text x="44" y="335" font-size="27" fill="#e2e8f0">Neutral</text><rect x="44" y="362" width="912" height="35" rx="8" fill="#40534f"/><text x="44" y="431" font-size="26" fill="#e2e8f0">Neither event; often near-average SST</text><text x="44" y="465" font-size="23" fill="#e2e8f0">Ocean and atmosphere may be out of step</text><rect x="24" y="510" width="952" height="186" rx="8" fill="#183b35"/><text x="44" y="545" font-size="27" fill="#e2e8f0">La Niña</text><rect x="44" y="572" width="912" height="35" rx="8" fill="#285f75"/><text x="44" y="641" font-size="26" fill="#e2e8f0">Cooler central / eastern Pacific</text><text x="44" y="675" font-size="23" fill="#e2e8f0">With a coupled atmospheric response</text><text x="24" y="732" font-size="24" fill="#e2e8f0">Conceptual; not current conditions</text></g></svg>