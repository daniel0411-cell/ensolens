<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1280" viewBox="0 0 480 1280"><rect width="480" height="1280" fill="#10201d"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="24" y="42" font-size="27" fill="#e2e8f0">Four stores, four diagnostics</text><rect x="24" y="90" width="408" height="255" rx="8" fill="#183b35"/><text x="42" y="124" font-size="25" fill="#e2e8f0">Soil: root-zone moisture</text><rect x="49" y="215" width="358" height="75" rx="8" fill="#65533a"/><path d="M49 215L407 215" fill="none" stroke="#34d399" stroke-width="3" /><path d="M99 185L99 259" fill="none" stroke="#d1bd8b" stroke-width="3" /><path d="M99 238L79 268" fill="none" stroke="#d1bd8b" stroke-width="3" /><path d="M184 185L184 259" fill="none" stroke="#d1bd8b" stroke-width="3" /><path d="M184 238L164 268" fill="none" stroke="#d1bd8b" stroke-width="3" /><path d="M269 185L269 259" fill="none" stroke="#d1bd8b" stroke-width="3" /><path d="M269 238L249 268" fill="none" stroke="#d1bd8b" stroke-width="3" /><text x="42" y="329" font-size="23" fill="#e2e8f0">Check depth, not surface wetting</text><rect x="24" y="370" width="408" height="255" rx="8" fill="#183b35"/><text x="42" y="404" font-size="25" fill="#e2e8f0">Snow: basin SWE</text><path d="M49 565l142.79999999999998 -120l183.6 120Z" fill="#536b76"/><path d="M191.79999999999998 445l-35 50h76Z" fill="#e2e8f0"/><text x="42" y="609" font-size="23" fill="#e2e8f0">Check snow level and reference</text><rect x="24" y="650" width="408" height="255" rx="8" fill="#183b35"/><text x="42" y="684" font-size="25" fill="#e2e8f0">Reservoir: storage</text><path d="M49 760l50 85h253l55 -85" fill="#287499" stroke="#afbbbf" stroke-width="4"/><rect x="372" y="750" width="25" height="100" rx="8" fill="#7e8f95"/><text x="42" y="889" font-size="23" fill="#e2e8f0">Check inflow and operations</text><rect x="24" y="930" width="408" height="255" rx="8" fill="#183b35"/><text x="42" y="964" font-size="25" fill="#e2e8f0">Groundwater: well levels</text><rect x="49" y="1035" width="358" height="95" rx="8" fill="#65533a"/><rect x="49" y="1085" width="358" height="45" rx="8" fill="#285f75"/><rect x="293.79999999999995" y="995" width="16" height="120" rx="8" fill="#cbd5e1"/><path d="M49 1085L407 1085" fill="none" stroke="#77b9de" stroke-width="3" stroke-dasharray="8 6"/><text x="42" y="1169" font-size="23" fill="#e2e8f0">Check recharge and pumping</text><text x="24" y="1234" font-size="24" fill="#e2e8f0">Separate diagnostics; no recovery</text><text x="24" y="1266" font-size="24" fill="#e2e8f0">times implied</text></g></svg>