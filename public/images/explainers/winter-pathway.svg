<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="#10201d"/><g font-family="Arial,sans-serif" fill="#e2e8f0"><text x="24" y="42" font-size="32" fill="#e2e8f0">From tropical heating to weather</text><rect x="24" y="90" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="125" font-size="26" fill="#e2e8f0">Tropical rainfall / heating</text><text x="42" y="172" font-size="23" fill="#e2e8f0">Ocean–atmosphere coupling</text><path d="M500 251L500 271" fill="none" stroke="#34d399" stroke-width="3" /><text x="492" y="273" font-size="25" fill="#34d399">↓</text><rect x="24" y="278" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="313" font-size="26" fill="#e2e8f0">Large-scale circulation</text><text x="42" y="360" font-size="23" fill="#e2e8f0">Influence beyond the tropics</text><path d="M500 439L500 459" fill="none" stroke="#34d399" stroke-width="3" /><text x="492" y="461" font-size="25" fill="#34d399">↓</text><rect x="24" y="466" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="501" font-size="26" fill="#e2e8f0">Winter jet / storm tracks</text><text x="42" y="548" font-size="23" fill="#e2e8f0">Regional seasonal tendencies</text><path d="M500 627L500 647" fill="none" stroke="#34d399" stroke-width="3" /><text x="492" y="649" font-size="25" fill="#34d399">↓</text><rect x="24" y="654" width="952" height="158" rx="8" fill="#183b35"/><text x="42" y="689" font-size="26" fill="#e2e8f0">Local weather</text><text x="42" y="736" font-size="23" fill="#e2e8f0">Storm position, elevation, air</text><text x="42" y="768" font-size="23" fill="#e2e8f0">mass</text><rect x="24" y="868" width="952" height="96" rx="8" fill="#294455"/><text x="42" y="902" font-size="23" fill="#e2e8f0">Each link depends on other variability. Not a daily jet map.</text></g></svg>